name: Criar APK para Android

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Corrigir visibilidade da API interna Kotlin
        shell: bash
        run: |
          FILE="app/src/main/java/com/vitkkk/flptoflm/MobileEffectSettingsTranslator.kt"
          sed -i 's/^enum class EffectSettingsQuality/internal enum class EffectSettingsQuality/' "$FILE"
          sed -i 's/^data class TranslatedMobileEffect/internal data class TranslatedMobileEffect/' "$FILE"
          sed -i 's/^object MobileEffectSettingsTranslator/internal object MobileEffectSettingsTranslator/' "$FILE"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar APK debug e capturar diagnóstico
        shell: bash
        run: |
          set +e
          gradle --stacktrace --no-daemon :app:assembleDebug 2>&1 | tee build-full.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$BUILD_EXIT" -ne 0 ]; then
            mkdir -p ci
            {
              echo "Commit: $GITHUB_SHA"
              echo "Data UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              grep -E '(^e: |^w: |error: |FAILURE:|What went wrong:|Execution failed for task)' build-full.log || true
            } > ci/last-kotlin-error.txt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci/last-kotlin-error.txt
            if ! git diff --cached --quiet; then
              git commit -m "Capture Kotlin compiler diagnostics [skip ci]"
              git push
            fi
            exit "$BUILD_EXIT"
          fi

      - name: Nomear APK com a versão
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          APK_NAME="FLP-para-FLM-${VERSION}"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APK_NAME}.apk"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Enviar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}.apk
          if-no-files-found: error
